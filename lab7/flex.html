<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox Example</title>
    <style>
        /* Батьківський елемент - контейнер Flexbox */
        .container {
            display: flex;
            flex-direction: row;
            /* Напрямок елементів зліва направо */
            flex-wrap: wrap;
            /* Елементи переносяться, якщо не поміщаються */
            justify-content: space-between;
            /* Простір між елементами рівномірний */
            align-items: center;
            /* Вирівнювання по центру вертикалі */
            align-content: stretch;
            /* Ряди елементів розтягуються */
            height: 300px;
            /* Висота контейнера */

        }

        /* Флекс-елементи */
        .item {
            flex-grow: 0;
            /* Елементи можуть збільшуватись */
            flex-shrink: 1;
            /* Елементи можуть зменшуватись */
            flex-basis: 150px;
            /* Початковий розмір елементів */
            margin: 10px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="item"><img alt="Логотип Tech Startup School" class="img-responsive"
                src="https://lpnu.ua/themes/lpnu/images/LPNU_logo_tech-startup-school.png" typeof="foaf:Image" /></div>
        <div class="item"><img alt="Логотип Tech Business School" class="img-responsive"
                src="https://lpnu.ua/themes/lpnu/images/LPNU_logo_tech-business-school.png" typeof="foaf:Image" /></div>
        <div class="item"><img alt="Логотип наукового парку SID City" class="img-responsive"
                src="https://lpnu.ua/themes/lpnu/images/LPNU_logo_SID-city-scientific-park.png" typeof="foaf:Image" />
        </div>
    </div>
</body>

</html>
