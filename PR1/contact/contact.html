      border-radius: 4px;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      background: #0077cc;

  <!-- Форма зворотного зв’язку -->
  <section>
    <form action="send-message.php" method="post">
      <label for="name">Ваше ім’я:</label>
