<!DOCTYPE html> 
<html lang="en"> 
<head> 
 <meta charset="UTF-8"> 
 <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>CSS Grid Layout Level 2 Example</title> 
 <style> 
 .container { 
 display: grid; 
 grid-template-columns: 1fr 2fr 1fr; /* Три колонки з різними відношеннями розмірів */ 
 grid-template-rows: 100px 200px 100px; /* Три ряди з фіксованою висотою */ 
 gap: 10px; /* Відстань між елементами сітки */ 
 grid-template-areas: 
 "header header header" 
 "sidebar content content" 
 "footer footer footer"; /* Іменовані області для елементів */  } 
 .header { 
 grid-area: header; 
 background-color: lightblue; 
 } 
 .sidebar { 
 grid-area: sidebar; 
 background-color: lightgreen; 
 } 
 .content { 
 grid-area: content; 
 background-color: lightcoral; 
 } 
 .footer { 
 grid-area: footer; 
 background-color: lightgoldenrodyellow;
 } 
 /* Стилі для дочірньої сітки з використанням субгрида */ 
 .content-grid { 
 display: grid; 
 grid-template-columns: subgrid; /* Наслідує колонки батьківської сітки */ 
 grid-template-rows: 1fr 1fr; /* Власні рядки */ 
 gap: 5px; 
 background-color: white; 
 } 
 .item1, .item2 { 
 background-color: #eee; 
 padding: 10px; 
 } 
 </style> 
</head> 
<body> 
 <div class="container"> 
 <div class="header">Заголовок (Header)</div> 
 <div class="sidebar">Сайдбар (Sidebar)</div> 
 <div class="content"> 
 Контентна область (Content Area) 
 <div class="content-grid"> 
 <div class="item1">Дочірній елемент 1</div> 
 <div class="item2">Дочірній елемент 2</div> 
 </div> 
 </div> 
 <div class="footer">Футер (Footer)</div> 
 </div> 
</body> 
</html>
