<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Student Card Form</title>
</head>
<body>
  <h1>Student Card FORM</h1>

  <form>
    <h2>Personal Information</h2>
    <fieldset>
      <legend>Provide your details</legend>
      <label>Full Name: <input type="text" name="fullname"></label><br><br>
      <label>Email: <input type="email" name="email"></label><br><br>
      <label>Password: <input type="password" name="password"></label><br><br>
      <label>Age: <input type="number" name="age" min="1"></label><br><br>
      <label>Date of Birth: <input type="date" name="dob"></label><br><br>

      Gender:<br>
      <p><label><input type="radio" name="gender" value="male"> Male</label></p>
      <p><label><input type="radio" name="gender" value="female"> Female</label></p>
      <p><label><input type="radio" name="gender" value="other"> Other</label></p><br><br>

      Languages Known:<br>
      <p><label><input type="checkbox" name="lang" value="english"> English</label><p/>
      <p><label><input type="checkbox" name="lang" value="spanish"> Spanish</label></p>
      <p><label><input type="checkbox" name="lang" value="french"> French</label></p><br><br>

      <label>Country:
        <select name="country">
          <option value="">Select your country</option>
          <option value="ukraine">Ukraine</option>
          <option value="usa">USA</option>
          <option value="france">France</option>
        </select>
      </label>
    </fieldset>
    <h2>College Subjects</h2>
    <fieldset>
      <legend>Select your subjects</legend>
       <label for="subjects">Choose subjects:</label><br>
  <select id="subjects" name="subjects" multiple size="4">
    <option>Mathematics</option>
    <option>Computer Science</option>
    <option>Physics</option>
    <option>History</option>
    <option>Chemistry</option>
  </select>

      <label>Rate your interest in Computer Science:
        <input type="range" name="interest_cs" min="0" max="10">
      </label>
    </fieldset>
<h2>Skills Assessment</h2>
    <fieldset>
      <legend>Assessment your Skills</legend>
      <label>Describe your skills:<br>
        <textarea name="skills" rows="4" cols="40"></textarea>
      </label><br><br>

      <label>Upload your resume:
        <input type="file" name="resume">
      </label><br><br>

      <label>Pick your favorite color:
        <input type="color" name="favcolor">
      </label><br><br>

      <label>Percent of study time:
        <input type="number" name="study_percent" min="0" max="100"> %
      </label>
    </fieldset>

    <br>
    <button type="submit">Submit Survey</button>
  </form>

  <footer>
    <p>© Student card by Vasily. All rights reserved.</p>
  </footer>
</body>
</html>
